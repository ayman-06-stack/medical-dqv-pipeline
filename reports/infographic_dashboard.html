<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical DQV Pipeline — Dashboard Infographic</title>
    <meta name="description" content="Infographic dashboard card for Medical Data Quality & Validation Pipeline technical report.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ─── Reset ─── */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0A1520;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ─── Dashboard Container ─── */
        .dashboard {
            width: 100%;
            max-width: 820px;
            background: #0D1B2A;
            border-radius: 24px;
            padding: 48px 44px 44px;
            border: 1px solid rgba(0, 180, 216, 0.12);
        }

        /* ─── Header ─── */
        .dashboard-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .dashboard-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 180, 216, 0.08);
            border: 1px solid rgba(0, 180, 216, 0.2);
            border-radius: 100px;
            padding: 6px 18px;
            margin-bottom: 16px;
        }

        .dashboard-badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00B4D8;
        }

        .dashboard-badge-text {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #00B4D8;
        }

        .dashboard-title {
            font-size: 22px;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
        }

        .dashboard-subtitle {
            font-size: 13px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.4);
        }

        /* ─── KPI Grid ─── */
        .kpi-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* ─── KPI Card ─── */
        .kpi-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 28px 24px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: border-color 0.3s ease, background 0.3s ease;
        }

        .kpi-card:hover {
            border-color: rgba(0, 180, 216, 0.25);
            background: rgba(0, 180, 216, 0.03);
        }

        /* Icon container */
        .kpi-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 180, 216, 0.1);
            flex-shrink: 0;
        }

        .kpi-icon svg {
            width: 22px;
            height: 22px;
            color: #00B4D8;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Text content */
        .kpi-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .kpi-value {
            font-size: 32px;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -1px;
            line-height: 1;
        }

        .kpi-value .kpi-value-accent {
            color: #00B4D8;
        }

        .kpi-label {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.45);
            line-height: 1.4;
        }

        /* ─── Tech tags (for the technology card) ─── */
        .tech-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .tech-tag {
            display: inline-flex;
            align-items: center;
            padding: 5px 14px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            color: #00B4D8;
            background: rgba(0, 180, 216, 0.1);
            border: 1px solid rgba(0, 180, 216, 0.15);
            letter-spacing: 0.2px;
        }

        /* ─── Footer ─── */
        .dashboard-footer {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22C55E;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
        }

        .footer-text {
            font-size: 11px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.3px;
        }

        .footer-version {
            font-size: 11px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.3px;
        }

        /* ─── Responsive ─── */
        @media (max-width: 560px) {
            .dashboard {
                padding: 32px 24px 28px;
            }

            .kpi-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .kpi-value {
                font-size: 26px;
            }

            .dashboard-title {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <!-- Header -->
    <div class="dashboard-header">
        <div class="dashboard-badge">
            <div class="dashboard-badge-dot"></div>
            <span class="dashboard-badge-text">Medical DQV Pipeline</span>
        </div>
        <h1 class="dashboard-title">Pipeline Performance Overview</h1>
        <p class="dashboard-subtitle">Data Quality &amp; Validation — Rapport technique</p>
    </div>

    <!-- KPI Grid -->
    <div class="kpi-grid">

        <!-- KPI 1: Lignes traitées -->
        <div class="kpi-card" id="kpi-lines-processed">
            <div class="kpi-icon">
                <!-- Dataset / table icon -->
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="3"/>
                    <line x1="3" y1="9" x2="21" y2="9"/>
                    <line x1="3" y1="15" x2="21" y2="15"/>
                    <line x1="9" y1="3" x2="9" y2="21"/>
                </svg>
            </div>
            <div class="kpi-content">
                <div class="kpi-value">55 <span class="kpi-value-accent">500</span></div>
                <div class="kpi-label">lignes traitées</div>
            </div>
        </div>

        <!-- KPI 2: Gain de performance -->
        <div class="kpi-card" id="kpi-performance-gain">
            <div class="kpi-icon">
                <!-- Lightning bolt icon -->
                <svg viewBox="0 0 24 24">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="none"/>
                </svg>
            </div>
            <div class="kpi-content">
                <div class="kpi-value"><span class="kpi-value-accent">×</span>10 000</div>
                <div class="kpi-label">gain de performance</div>
            </div>
        </div>

        <!-- KPI 3: Modules indépendants -->
        <div class="kpi-card" id="kpi-modules">
            <div class="kpi-icon">
                <!-- Puzzle piece icon -->
                <svg viewBox="0 0 24 24">
                    <path d="M5 8h2.5a2.5 2.5 0 0 1 0 5H5V8z"/>
                    <path d="M5 8V5.5A2.5 2.5 0 0 1 10 5.5V8"/>
                    <rect x="5" y="8" width="14" height="5" rx="1"/>
                    <rect x="5" y="13" width="14" height="5" rx="1"/>
                    <path d="M15 8V5.5a2.5 2.5 0 0 1 5 0V8"/>
                </svg>
            </div>
            <div class="kpi-content">
                <div class="kpi-value"><span class="kpi-value-accent">5</span></div>
                <div class="kpi-label">modules indépendants</div>
            </div>
        </div>

        <!-- KPI 4: Technologies clés -->
        <div class="kpi-card" id="kpi-technologies">
            <div class="kpi-icon">
                <!-- Code brackets icon -->
                <svg viewBox="0 0 24 24">
                    <polyline points="16 18 22 12 16 6"/>
                    <polyline points="8 6 2 12 8 18"/>
                    <line x1="14" y1="4" x2="10" y2="20"/>
                </svg>
            </div>
            <div class="kpi-content">
                <div class="kpi-value"><span class="kpi-value-accent">3</span></div>
                <div class="kpi-label">technologies clés</div>
                <div class="tech-tags">
                    <span class="tech-tag">Python</span>
                    <span class="tech-tag">DVC</span>
                    <span class="tech-tag">Streamlit</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <div class="dashboard-footer">
        <div class="footer-left">
            <div class="footer-dot"></div>
            <span class="footer-text">Pipeline opérationnel</span>
        </div>
        <span class="footer-version">v1.0-anonymized</span>
    </div>
</div>

</body>
</html>
